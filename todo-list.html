<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f2">
<title>Today — To-do List</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#203d37;background:#f5f7f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#dceee5 0,transparent 38%),radial-gradient(circle at 95% 75%,#f5e6cd 0,transparent 35%),#f5f7f2}button,input{font:inherit}button{cursor:pointer}.shell{max-width:780px;margin:0 auto;padding:64px 22px 90px}.eyebrow{color:#287565;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.top h1{font-size:clamp(38px,7vw,62px);line-height:1.05;margin:12px 0 8px;letter-spacing:-.055em}.sub{color:#5c7169;margin:0;font-size:15px}.date{color:#3d6257;border:1px solid #cfdfd3;background:#eaf2e9;padding:10px 14px;border-radius:15px;white-space:nowrap;font-size:13px;margin-top:28px}.panel{margin-top:34px;background:#fffefa;border:1px solid #dce5d9;border-radius:26px;padding:25px;box-shadow:0 25px 70px #244d3514}.progress-top{display:flex;justify-content:space-between;gap:12px;color:#576f65;font-size:14px}.progress-top strong{color:#234c40}.bar{height:9px;background:#e4ece0;border-radius:20px;margin-top:14px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#18816a,#8cc9a0);border-radius:20px;transition:width .3s}.add{display:flex;gap:11px;margin-top:30px}.add input,.search{width:100%;color:#203d37;background:#f5f8f1;border:1px solid #cbdace;border-radius:15px;padding:16px 17px;outline:none}.add input:focus,.search:focus,.editing:focus{border-color:#23826a;box-shadow:0 0 0 3px #23826a22}input::placeholder{color:#687d70}.primary{border:0;background:#196c57;color:#ffffff;padding:0 23px;border-radius:15px;font-weight:800;white-space:nowrap}.primary:hover{background:#125440}.tools{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:30px}.tabs{display:flex;gap:5px;background:#f5f8f1;padding:5px;border-radius:13px}.tabs button{background:transparent;color:#576f65;border:0;border-radius:9px;padding:9px 14px;font-size:13px}.tabs button.active{background:#196c57;color:#ffffff}.search{max-width:235px;padding:10px 13px;font-size:13px;border-radius:11px}.list{list-style:none;padding:0;margin:17px 0 0}.item{display:flex;align-items:center;gap:14px;background:#ffffff;border:1px solid #dce5d9;border-radius:16px;padding:15px 16px;margin-bottom:10px;min-height:65px}.check{appearance:none;width:23px;height:23px;flex:none;border:2px solid #7c9787;border-radius:8px;display:grid;place-items:center;cursor:pointer;margin:0}.check:checked{background:#237a60;border-color:#237a60}.check:checked:after{content:'✓';color:#ffffff;font-weight:900;font-size:16px}.task{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}.done .task{color:#61796a;text-decoration:line-through}.action{background:transparent;color:#627d6d;border:0;padding:7px;border-radius:8px;font-size:16px}.action:hover{color:#ffffff;background:#e4eee2}.editing{width:100%;color:#ffffff;background:#f5f8f1;border:1px solid #196c57;border-radius:8px;padding:8px;outline:none}.empty{text-align:center;padding:55px 18px;color:#5c7169}.empty .icon{font-size:34px;margin-bottom:12px}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#607668;font-size:13px;padding:17px 4px}.clear{background:none;border:0;color:#196c57}.clear:disabled{opacity:.4;cursor:default}@media(max-width:600px){.shell{padding-top:37px}.date{display:none}.panel{padding:17px}.tools{align-items:stretch}.search{max-width:none}.tabs{justify-content:space-between}.tabs button{flex:1}.add{flex-direction:column}.primary{padding:15px}}

/* Sage and cream palette: clear states and visible keyboard navigation. */
:root{color-scheme:light}
button{transition:background-color .18s,color .18s,box-shadow .18s}
.primary{box-shadow:0 5px 14px #196c5720}
button:focus-visible,.check:focus-visible{outline:3px solid #b56a28;outline-offset:3px}
.item.done{background:#eff6eb;border-color:#d4e3cd}
.clear:hover:not(:disabled){color:#104c3b;text-decoration:underline}
@media(prefers-reduced-motion:reduce){button,.bar span{transition:none}}
</style>
</head>
<body><main class="shell"><header class="top"><div><div class="eyebrow">YOUR SPACE TO FOCUS</div><h1>วันนี้ทำอะไรดี ✦</h1><p class="sub">วางแผนทีละอย่าง แล้วค่อย ๆ ทำให้สำเร็จ</p></div><div class="date" id="date"></div></header><section class="panel" aria-label="รายการงาน"><div class="progress-top"><strong>ความคืบหน้าวันนี้</strong><span id="progress-text">0 จาก 0 งาน</span></div><div class="bar" role="progressbar" aria-label="ความคืบหน้า" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><span id="progress-fill"></span></div><form class="add" id="form"><input id="new-task" maxlength="200" autocomplete="off" placeholder="เพิ่มสิ่งที่อยากทำ..." aria-label="ชื่องาน" required><button class="primary" type="submit">+ เพิ่มงาน</button></form><div class="tools"><div class="tabs" role="group" aria-label="กรองงาน"><button type="button" class="active" data-filter="all">ทั้งหมด</button><button type="button" data-filter="active">ยังไม่เสร็จ</button><button type="button" data-filter="done">เสร็จแล้ว</button></div><input class="search" id="search" type="search" placeholder="⌕  ค้นหางาน" aria-label="ค้นหางาน"></div><ul class="list" id="list"></ul><div class="empty" id="empty" hidden><div class="icon">✧</div><div id="empty-text">ยังไม่มีงาน เพิ่มงานแรกได้เลย</div></div><div class="footer"><span id="remaining">เหลือ 0 งาน</span><button class="clear" id="clear" type="button">ลบงานที่เสร็จแล้ว</button></div></section></main>
<script>
(()=>{'use strict';const key='today-tasks-v1';const $=s=>document.querySelector(s);let tasks=[];try{const parsed=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(parsed))tasks=parsed.filter(t=>t&&typeof t.id==='string'&&typeof t.text==='string'&&typeof t.done==='boolean').slice(0,2000)}catch{}let filter='all';const save=()=>{try{localStorage.setItem(key,JSON.stringify(tasks))}catch{alert('บันทึกข้อมูลไม่ได้ กรุณาตรวจพื้นที่จัดเก็บของเบราว์เซอร์')}};const date=new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'long',year:'numeric'}).format(new Date());$('#date').textContent=date;function render(){const done=tasks.filter(t=>t.done).length,total=tasks.length,pct=total?Math.round(done/total*100):0;$('#progress-text').textContent=`${done} จาก ${total} งาน`;$('#progress-fill').style.width=pct+'%';$('#progress').setAttribute('aria-valuenow',pct);$('#remaining').textContent=`เหลือ ${total-done} งาน`;$('#clear').disabled=!done;const query=$('#search').value.trim().toLocaleLowerCase();const visible=tasks.filter(t=>(filter==='all'||(filter==='done')===t.done)&&t.text.toLocaleLowerCase().includes(query));const list=$('#list');list.replaceChildren();for(const t of visible){const li=document.createElement('li');li.className='item'+(t.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=t.done;check.setAttribute('aria-label',`ทำงาน ${t.text} เสร็จแล้ว`);check.addEventListener('change',()=>{t.done=check.checked;save();render()});const label=document.createElement('span');label.className='task';label.textContent=t.text;label.title='ดับเบิลคลิกเพื่อแก้ไข';label.addEventListener('dblclick',edit);const editBtn=document.createElement('button');editBtn.className='action';editBtn.type='button';editBtn.textContent='✎';editBtn.title='แก้ไขงาน';editBtn.setAttribute('aria-label',`แก้ไข ${t.text}`);editBtn.addEventListener('click',edit);const del=document.createElement('button');del.className='action';del.type='button';del.textContent='×';del.title='ลบงาน';del.setAttribute('aria-label',`ลบ ${t.text}`);del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()});li.append(check,label,editBtn,del);list.append(li);function edit(){const input=document.createElement('input');input.className='editing';input.maxLength=200;input.value=t.text;input.setAttribute('aria-label','แก้ไขชื่องาน');label.replaceWith(input);input.focus();input.select();let finished=false;function finish(commit){if(finished)return;finished=true;const next=input.value.trim();if(commit&&next){t.text=next;save()}render()}input.addEventListener('keydown',e=>{if(e.key==='Enter')finish(true);if(e.key==='Escape')finish(false)});input.addEventListener('blur',()=>finish(true))}}$('#empty').hidden=visible.length>0;$('#empty-text').textContent=total===0?'ยังไม่มีงาน เพิ่มงานแรกได้เลย':'ไม่พบงานที่ตรงกับตัวกรอง';}$('#form').addEventListener('submit',e=>{e.preventDefault();const input=$('#new-task'),value=input.value.trim();if(!value)return;tasks.unshift({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),text:value,done:false});input.value='';save();render();input.focus()});document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{filter=btn.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===btn));render()}));$('#search').addEventListener('input',render);$('#clear').addEventListener('click',()=>{tasks=tasks.filter(t=>!t.done);save();render()});render()})();
</script></body></html>
